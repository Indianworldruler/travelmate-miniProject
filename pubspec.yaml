name: travelmate
description: A colourful offline-first travel planner built with Flutter and Firebase Realtime Database.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase Realtime Database only.
  firebase_core: ^4.14.0
  firebase_database: ^12.5.0

  # Offline/local structured storage.
  path_provider: ^2.1.6
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3

  # Local travel documents.
  file_picker: ^12.3.0
  open_filex: ^4.7.0

  # Google Maps/external URL launching.
  url_launcher: ^6.3.2

  # Utilities used by the UI/forms.
  intl: ^0.20.2
  uuid: ^4.5.1
  firebase_auth: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
